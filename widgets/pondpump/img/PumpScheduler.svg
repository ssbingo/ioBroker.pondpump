<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243244"/>
      <stop offset="1" stop-color="#151d28"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="192" height="212" rx="16" fill="url(#bg3)"/>
  <text x="18" y="30" fill="#8fa0b6" font-family="Arial" font-size="11" font-weight="700" letter-spacing="1.5">SCHEDULER</text>
  <rect x="112" y="18" width="72" height="18" rx="9" fill="rgba(90,195,106,.18)"/>
  <circle cx="123" cy="27" r="4" fill="#5ac36a"/>
  <text x="131" y="31" fill="#5ac36a" font-family="Arial" font-size="10" font-weight="700">ACTIVE</text>

  <!-- hero -->
  <rect x="16" y="46" width="86" height="52" rx="12" fill="rgba(255,255,255,.05)"/>
  <text x="59" y="82" fill="#38aaff" font-family="Arial" font-size="30" font-weight="800" text-anchor="middle">65<tspan font-size="14" fill="#8fa0b6">%</tspan></text>
  <text x="59" y="93" fill="#8fa0b6" font-family="Arial" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">OUTPUT</text>
  <rect x="112" y="50" width="60" height="16" rx="8" fill="rgba(90,195,106,.16)"/>
  <text x="120" y="62" fill="#5ac36a" font-family="Arial" font-size="9" font-weight="700">Running</text>
  <rect x="112" y="70" width="46" height="16" rx="8" fill="rgba(255,255,255,.06)"/>
  <text x="120" y="82" fill="#a7b4c6" font-family="Arial" font-size="9" font-weight="700">☀ Day</text>

  <!-- reason chips -->
  <rect x="16" y="106" width="66" height="16" rx="7" fill="rgba(56,170,255,.14)"/>
  <text x="24" y="118" fill="#7cc2ff" font-family="Arial" font-size="9" font-weight="700">Curve</text>
  <rect x="88" y="106" width="80" height="16" rx="7" fill="rgba(255,193,58,.16)"/>
  <text x="96" y="118" fill="#ffcf5a" font-family="Arial" font-size="9" font-weight="700">Weather boost</text>

  <!-- info rows -->
  <g font-family="Arial" font-size="10">
    <text x="18" y="140" fill="#8fa0b6">Window</text>
    <text x="94" y="140" fill="#eef2f7" font-weight="700" text-anchor="end">08:00–19:58</text>
    <line x1="16" y1="146" x2="96" y2="146" stroke="rgba(255,255,255,.06)"/>
    <text x="104" y="140" fill="#8fa0b6">Next</text>
    <text x="184" y="140" fill="#eef2f7" font-weight="700" text-anchor="end">19:58</text>
    <line x1="104" y1="146" x2="184" y2="146" stroke="rgba(255,255,255,.06)"/>
  </g>

  <!-- water temp + telemetry -->
  <rect x="16" y="156" width="52" height="40" rx="10" fill="rgba(255,255,255,.05)"/>
  <text x="42" y="178" fill="#63c76a" font-family="Arial" font-size="15" font-weight="800" text-anchor="middle">18.4<tspan font-size="8" fill="#8fa0b6">°C</tspan></text>
  <text x="42" y="190" fill="#8fa0b6" font-family="Arial" font-size="7" font-weight="700" text-anchor="middle">WATER</text>
  <rect x="74" y="156" width="52" height="40" rx="10" fill="rgba(255,255,255,.05)"/>
  <text x="100" y="178" fill="#eef2f7" font-family="Arial" font-size="15" font-weight="800" text-anchor="middle">136<tspan font-size="8" fill="#8fa0b6">W</tspan></text>
  <text x="100" y="190" fill="#8fa0b6" font-family="Arial" font-size="7" font-weight="700" text-anchor="middle">POWER</text>
  <rect x="132" y="156" width="52" height="40" rx="10" fill="rgba(255,255,255,.05)"/>
  <text x="158" y="178" fill="#eef2f7" font-family="Arial" font-size="14" font-weight="800" text-anchor="middle">2648<tspan font-size="7" fill="#8fa0b6">rpm</tspan></text>
  <text x="158" y="190" fill="#8fa0b6" font-family="Arial" font-size="7" font-weight="700" text-anchor="middle">SPEED</text>
</svg>
