<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33b0c6"/>
      <stop offset="1" stop-color="#12566f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f7f9"/>
      <stop offset="0.5" stop-color="#c8d1d7"/>
      <stop offset="1" stop-color="#8f9aa2"/>
    </linearGradient>
    <linearGradient id="steelPipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f5"/>
      <stop offset="0.5" stop-color="#c2cbd1"/>
      <stop offset="1" stop-color="#8b969e"/>
    </linearGradient>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565d68"/>
      <stop offset="1" stop-color="#2c313a"/>
    </linearGradient>
    <radialGradient id="bore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a525b"/>
      <stop offset="0.7" stop-color="#20262d"/>
      <stop offset="1" stop-color="#0e1216"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- subtle water waves -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M70 452 q34 -20 68 0 t68 0 t68 0 t68 0 t68 0"/>
    <path d="M70 478 q34 -20 68 0 t68 0 t68 0 t68 0 t68 0"/>
  </g>

  <!-- foot / stand -->
  <path d="M96 402 q-6 -34 46 -34 h250 q60 0 60 32 q0 22 -54 22 h-256 q-40 0 -46 -20 z" fill="#1b2530"/>

  <!-- gooseneck outlet (behind body) -->
  <g>
    <path d="M336 190 C 360 150 400 148 428 130" fill="none" stroke="url(#steelPipe)" stroke-width="58" stroke-linecap="round"/>
    <!-- threaded end of the outlet -->
    <g transform="rotate(-31 430 128)">
      <g stroke="#8b969e" stroke-width="3.5" stroke-opacity="0.6">
        <line x1="398" y1="104" x2="398" y2="152"/>
        <line x1="410" y1="102" x2="410" y2="154"/>
        <line x1="421" y1="102" x2="421" y2="154"/>
      </g>
      <ellipse cx="430" cy="128" rx="15" ry="28" fill="url(#steelPipe)"/>
      <ellipse cx="430" cy="128" rx="8" ry="19" fill="#cbd3d9"/>
    </g>
  </g>

  <!-- dark motor housing (left) -->
  <path d="M118 158 q0 -14 22 -14 h96 q22 0 22 22 v196 q0 20 -22 20 h-96 q-22 0 -22 -22 z" fill="url(#housing)"/>
  <!-- top handle/lever -->
  <path d="M176 146 q4 -26 30 -26 h74 q22 0 22 26 z" fill="#3a404a"/>

  <!-- control dial -->
  <circle cx="162" cy="238" r="30" fill="#2a2f37"/>
  <circle cx="162" cy="238" r="21" fill="#454c56"/>
  <rect x="150" y="226" width="24" height="24" rx="6" transform="rotate(20 162 238)" fill="#2f6fb0"/>
  <circle cx="162" cy="238" r="4.5" fill="#dfe6ea"/>

  <!-- stainless body / chamber -->
  <path d="M232 176
           C 250 150 330 146 372 168
           C 412 189 420 244 414 292
           C 408 344 378 372 320 372
           L 252 372
           C 226 372 214 320 220 268
           C 224 224 224 192 232 176 Z" fill="url(#steel)"/>
  <!-- polished flange ring between housing and body -->
  <ellipse cx="246" cy="262" rx="17" ry="104" fill="#eef4f6" fill-opacity="0.9"/>
  <!-- body highlight -->
  <ellipse cx="300" cy="215" rx="58" ry="34" fill="#ffffff" fill-opacity="0.28"/>

  <!-- front port (foreground) -->
  <path d="M360 300 C 402 314 442 330 468 344" fill="none" stroke="url(#steelPipe)" stroke-width="78" stroke-linecap="round"/>
  <!-- thread lines on the port -->
  <g stroke="#8b969e" stroke-width="3.5" stroke-opacity="0.65" fill="none">
    <path d="M392 279 q6 40 -8 78"/>
    <path d="M412 285 q6 40 -8 78"/>
    <path d="M432 293 q6 38 -8 74"/>
  </g>
  <!-- opening rim + bore -->
  <g transform="rotate(24 470 344)">
    <ellipse cx="470" cy="344" rx="42" ry="54" fill="url(#steelPipe)"/>
    <ellipse cx="470" cy="344" rx="30" ry="41" fill="url(#bore)"/>
  </g>
</svg>
