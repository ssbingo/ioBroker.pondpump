version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/src-widgets"
      - "/src-admin"
    schedule:
      # Randomised ~monthly slot (spreads Dependabot load across adapters — repochecker S8906)
      interval: cron
      timezone: Europe/Berlin
      cronjob: '34 4 9 * *'
    open-pull-requests-limit: 15
    assignees:
      - ssbingo
    versioning-strategy: increase
    # Reduce supply-chain risk: wait a few days before proposing a freshly published version
    cooldown:
      default-days: 7
    ignore:
      # Node type definitions must track the supported runtime (Node 22); never bump the major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Two module-federation hosts with DIFFERENT React/MUI majors — freeze each where it is,
      # since a major bump would break singleton compatibility with its host:
      #   - src-admin  → iobroker.admin >=8 host = React 19 + MUI 9 + @iobroker/json-config 9
      #     (@iobroker/gui-components replaces adapter-react-v5 there; no React-19 adapter-react-v5).
      #   - src-widgets → vis-2 host = React 18 + MUI 6 + @iobroker/adapter-react-v5 8.3.x.
      # One npm entry covers both dirs, so the per-major ignores pin admin at 19/9 and widgets at 18/6.
      - dependency-name: "react"
        update-types:
          - version-update:semver-major
      - dependency-name: "react-dom"
        update-types:
          - version-update:semver-major
      - dependency-name: "@mui/material"
        update-types:
          - version-update:semver-major
      - dependency-name: "@mui/icons-material"
        update-types:
          - version-update:semver-major
      - dependency-name: "@iobroker/json-config"
        update-types:
          - version-update:semver-major
      - dependency-name: "vite"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      # TypeScript 7 (tsgo) is not yet supported by @iobroker/eslint-config — stay on 5.x
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      timezone: Europe/Berlin
      cronjob: '52 5 23 * *'
    open-pull-requests-limit: 15
    assignees:
      - ssbingo
    cooldown:
      default-days: 7
