name: Handbook PDFs

# Regenerate the beginner-handbook PDFs from their Markdown sources using md-to-pdf (Chromium).
# The PDFs are normally generated locally (`npm run handbook:pdf`) and committed; this manual
# workflow is a fallback for regenerating them on a runner that installs the Chromium libraries.
on:
  workflow_dispatch: {}

concurrency:
  group: handbook-pdf
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the regenerated PDFs back

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 libgbm1 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libatspi2.0-0 \
            libpango-1.0-0 libcairo2 libnss3 libnspr4 libxshmfence1 || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Generate handbook PDFs
        run: npm run handbook:pdf

      - name: Commit regenerated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add doc/handbook/en/manual.pdf doc/handbook/de/manual.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged — nothing to commit."
          else
            git commit -m "docs: regenerate handbook PDFs [skip ci]"
            git push
          fi
